<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumine | Redirecionando</title>
    <script>
      const redirectPath = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      window.location.replace(`/index.html?redirect=${encodeURIComponent(redirectPath)}`);
    </script>
  </head>
  <body>
    <p>Redirecionando para a Lumine...</p>
  </body>
</html>
